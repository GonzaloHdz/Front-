<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Onboarding Corporativo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize.css@8.0.0/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/cs-skin-elastic.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">
    <div class="sufee-login d-flex align-content-center flex-wrap min-vh-100">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-sm border-0">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <h2 class="mb-2">Onboarding Corporativo</h2>
                                <p class="text-muted mb-0">Complete el perfil legal de la empresa para habilitar la operacion multi-tenant.</p>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex align-items-center justify-content-between text-uppercase small text-muted mb-2">
                                    <span>Paso 1</span>
                                    <span>Perfil legal obligatorio</span>
                                </div>
                                <div class="progress" style="height: 8px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: 100%;" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </div>

                            <div id="company-onboarding-feedback" class="alert d-none" role="alert"></div>

                            <form id="company-onboarding-form" novalidate>
                                <div class="form-group">
                                    <label for="onboarding-company-name">Nombre de la Empresa</label>
                                    <input id="onboarding-company-name" type="text" class="form-control" required placeholder="Nombre legal o comercial">
                                </div>

                                <div class="form-group">
                                    <label for="onboarding-company-rfc">RFC</label>
                                    <input id="onboarding-company-rfc" type="text" class="form-control" required placeholder="Ej. XAXX010101000">
                                </div>

                                <div class="form-group">
                                    <label for="onboarding-company-phone">Telefono</label>
                                    <input id="onboarding-company-phone" type="text" class="form-control" required placeholder="Ej. 2291234567">
                                </div>

                                <div class="d-flex justify-content-end">
                                    <button id="company-onboarding-submit" type="submit" class="btn btn-success px-4">Guardar y Continuar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/http-client.js"></script>
    <script src="assets/js/services/auth.service.js"></script>
    <script src="assets/js/pages/company-onboarding.js"></script>
</body>
</html>
