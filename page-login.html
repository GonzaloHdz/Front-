<body class="bg-dark">

    <div class="sufee-login d-flex align-content-center flex-wrap">
        <div class="container">
            <div class="login-content">
                <div class="login-logo">
                    <a href="index.html">
                        <img class="align-content" src="images/logo.png" alt="">
                    </a>
                </div>
                <div class="login-form">
                    <form id="login-form" novalidate>
                        <div id="login-feedback" class="alert d-none" role="alert"></div>
                        <div class="form-group">
                            <label for="company-id">Company ID</label>
                            <input id="company-id" name="company_id" type="number" min="1" step="1" class="form-control" placeholder="Company ID" required>
                            <small class="form-text text-muted">Requerido por el backend para autenticar al usuario.</small>
                        </div>
                        <div class="form-group">
                            <label for="login-email">Email address</label>
                            <input id="login-email" name="email" type="email" class="form-control" placeholder="Email" autocomplete="email" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input id="login-password" name="password" type="password" class="form-control" placeholder="Password" autocomplete="current-password" required>
                        </div>
                        <div class="checkbox">
                            <label>
                                <input id="remember-session" type="checkbox" checked> Remember Me
                            </label>
                            <label class="pull-right">
                                <a href="pages-forget.html">Forgotten Password?</a>
                            </label>
                        </div>
                        <button id="login-submit" type="submit" class="btn btn-success btn-flat m-b-30 m-t-30">Sign in</button>
                        <div class="register-link m-t-15 text-center">
                            <p>Don't have account ? <a href="page-register.html">Sign Up Here</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@2.2.4/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.4/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-match-height@0.7.2/dist/jquery.matchHeight.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/services/http-client.js"></script>
    <script src="assets/js/services/auth.service.js"></script>
    <script src="assets/js/pages/login.js"></script>

</body>
